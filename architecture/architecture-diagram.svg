<svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="820" fill="url(#bgGrad)" rx="16" />
  
  <!-- Title Header -->
  <text x="60" y="50" fill="#FFFFFF" font-size="22" font-weight="bold">Production Scale Architecture: Vacation-Rental Marketplace</text>
  <text x="60" y="75" fill="#94A3B8" font-size="13">Global Multi-Region Scaling Strategy for Airbnb-Grade Workloads (100M+ Monthly Users)</text>

  <!-- LAYER 1: CLIENTS & CDN EDGE -->
  <g transform="translate(60, 100)">
    <rect width="1080" height="110" fill="#1E293B" stroke="#334155" stroke-width="1.5" rx="12" filter="url(#glow)"/>
    <text x="20" y="30" fill="#38BDF8" font-size="12" font-weight="bold" letter-spacing="1">1. CLIENT TIER &amp; GLOBAL EDGE NETWORK (CDN / ANYCAST DNS)</text>

    <!-- Web App -->
    <rect x="20" y="45" width="240" height="50" rx="8" fill="#0F172A" stroke="#0284C7" stroke-width="1" />
    <text x="35" y="68" fill="#F8FAFC" font-size="13" font-weight="600">Web App (Next.js / React)</text>
    <text x="35" y="84" fill="#94A3B8" font-size="11">Vite / SSR &amp; Edge Hydration</text>

    <!-- Mobile Native Apps -->
    <rect x="280" y="45" width="240" height="50" rx="8" fill="#0F172A" stroke="#0284C7" stroke-width="1" />
    <text x="295" y="68" fill="#F8FAFC" font-size="13" font-weight="600">Mobile Native (iOS / Android)</text>
    <text x="295" y="84" fill="#94A3B8" font-size="11">React Native &amp; Swift / Kotlin</text>

    <!-- Cloudflare Edge CDN & WAF -->
    <rect x="540" y="45" width="250" height="50" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1" />
    <text x="555" y="68" fill="#FDE047" font-size="13" font-weight="600">Cloudflare Edge &amp; WAF</text>
    <text x="555" y="84" fill="#94A3B8" font-size="11">DDoS Mitigation, Bot Shield, SSL</text>

    <!-- Static Assets & Media CDN -->
    <rect x="810" y="45" width="250" height="50" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1" />
    <text x="825" y="68" fill="#6EE7B7" font-size="13" font-weight="600">Image / Video Optimizer</text>
    <text x="825" y="84" fill="#94A3B8" font-size="11">Cloudflare Images / WebP / AVIF</text>
  </g>

  <!-- LAYER 2: API GATEWAY & INGRESS -->
  <g transform="translate(60, 230)">
    <rect width="1080" height="90" fill="#1E293B" stroke="#334155" stroke-width="1.5" rx="12" filter="url(#glow)"/>
    <text x="20" y="25" fill="#A855F7" font-size="12" font-weight="bold" letter-spacing="1">2. INGRESS &amp; API GATEWAY ROUTING</text>

    <!-- Kong / Envoy Gateway -->
    <rect x="20" y="38" width="330" height="42" rx="6" fill="#0F172A" stroke="#A855F7" stroke-width="1" />
    <text x="35" y="60" fill="#F3E8FF" font-size="12" font-weight="600">Kong / Envoy API Gateway</text>
    <text x="35" y="72" fill="#94A3B8" font-size="10">JWT Auth, Rate Limiting (Token Bucket)</text>

    <!-- GraphQL Federation / BFF -->
    <rect x="375" y="38" width="330" height="42" rx="6" fill="#0F172A" stroke="#A855F7" stroke-width="1" />
    <text x="390" y="60" fill="#F3E8FF" font-size="12" font-weight="600">GraphQL Subgraph Router (Apollo)</text>
    <text x="390" y="72" fill="#94A3B8" font-size="10">Schema Federation &amp; Query Batching</text>

    <!-- Distributed Service Mesh -->
    <rect x="730" y="38" width="330" height="42" rx="6" fill="#0F172A" stroke="#A855F7" stroke-width="1" />
    <text x="745" y="60" fill="#F3E8FF" font-size="12" font-weight="600">Istio Service Mesh / mTLS</text>
    <text x="745" y="72" fill="#94A3B8" font-size="10">Zero-Trust Network, Circuit Breaking</text>
  </g>

  <!-- LAYER 3: CORE MICROSERVICES (KUBERNETES) -->
  <g transform="translate(60, 340)">
    <rect width="1080" height="150" fill="#1E293B" stroke="#334155" stroke-width="1.5" rx="12" filter="url(#glow)"/>
    <text x="20" y="25" fill="#EC4899" font-size="12" font-weight="bold" letter-spacing="1">3. MICROSERVICES DOMAIN TIER (CONTAINERIZED ON KUBERNETES EKS)</text>

    <!-- Search & Discovery Service -->
    <rect x="20" y="40" width="190" height="95" rx="8" fill="#0F172A" stroke="#EC4899" stroke-width="1" />
    <text x="32" y="65" fill="#FDF2F8" font-size="12" font-weight="bold">Listing &amp; Search</text>
    <text x="32" y="82" fill="#94A3B8" font-size="10">• Geo-spatial filters</text>
    <text x="32" y="98" fill="#94A3B8" font-size="10">• Price &amp; amenity rank</text>
    <text x="32" y="114" fill="#94A3B8" font-size="10">• Vector semantic search</text>

    <!-- Booking & Concurrency Service -->
    <rect x="230" y="40" width="195" height="95" rx="8" fill="#0F172A" stroke="#FF385C" stroke-width="1.5" />
    <text x="242" y="65" fill="#FFE4E6" font-size="12" font-weight="bold">Booking Engine</text>
    <text x="242" y="82" fill="#94A3B8" font-size="10">• Redlock distributed lock</text>
    <text x="242" y="98" fill="#94A3B8" font-size="10">• Double-booking prevention</text>
    <text x="242" y="114" fill="#94A3B8" font-size="10">• Two-Phase Commit Saga</text>

    <!-- Payments & Pricing Service -->
    <rect x="445" y="40" width="195" height="95" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1" />
    <text x="457" y="65" fill="#ECFDF5" font-size="12" font-weight="bold">Payments &amp; Pricing</text>
    <text x="457" y="82" fill="#94A3B8" font-size="10">• Stripe / UPI integrations</text>
    <text x="457" y="98" fill="#94A3B8" font-size="10">• Dynamic surge pricing</text>
    <text x="457" y="114" fill="#94A3B8" font-size="10">• Host payout scheduler</text>

    <!-- Reviews & Ratings Service -->
    <rect x="660" y="40" width="195" height="95" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1" />
    <text x="672" y="65" fill="#FEF3C7" font-size="12" font-weight="bold">Reviews &amp; Social</text>
    <text x="672" y="82" fill="#94A3B8" font-size="10">• Laurel badge metrics</text>
    <text x="672" y="98" fill="#94A3B8" font-size="10">• Sentiment categorization</text>
    <text x="672" y="114" fill="#94A3B8" font-size="10">• Wishlist sync</text>

    <!-- Notifications & Messaging -->
    <rect x="875" y="40" width="185" height="95" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1" />
    <text x="887" y="65" fill="#E0F2FE" font-size="12" font-weight="bold">Host Messaging</text>
    <text x="887" y="82" fill="#94A3B8" font-size="10">• WebSocket live chat</text>
    <text x="887" y="98" fill="#94A3B8" font-size="10">• Push notifications</text>
    <text x="887" y="114" fill="#94A3B8" font-size="10">• Email &amp; SMS webhooks</text>
  </g>

  <!-- LAYER 4: DATA PERSISTENCE & CACHING -->
  <g transform="translate(60, 510)">
    <rect width="1080" height="130" fill="#1E293B" stroke="#334155" stroke-width="1.5" rx="12" filter="url(#glow)"/>
    <text x="20" y="25" fill="#22D3EE" font-size="12" font-weight="bold" letter-spacing="1">4. DATA PERSISTENCE, CACHING &amp; SEARCH LAYER</text>

    <!-- CockroachDB / PostgreSQL -->
    <rect x="20" y="40" width="245" height="75" rx="8" fill="#0F172A" stroke="#22D3EE" stroke-width="1" />
    <text x="32" y="65" fill="#E0F2FE" font-size="12" font-weight="bold">Primary RDBMS</text>
    <text x="32" y="82" fill="#94A3B8" font-size="10">CockroachDB / PostgreSQL (ACID)</text>
    <text x="32" y="98" fill="#94A3B8" font-size="10">Geo-partitioned, multi-region</text>

    <!-- Redis Cluster -->
    <rect x="285" y="40" width="245" height="75" rx="8" fill="#0F172A" stroke="#EF4444" stroke-width="1" />
    <text x="297" y="65" fill="#FEE2E2" font-size="12" font-weight="bold">Redis Cluster 7.x</text>
    <text x="297" y="82" fill="#94A3B8" font-size="10">Distributed Locks (Redlock)</text>
    <text x="297" y="98" fill="#94A3B8" font-size="10">Calendar Availability Cache (&lt;1ms)</text>

    <!-- OpenSearch / Elasticsearch -->
    <rect x="550" y="40" width="245" height="75" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1" />
    <text x="562" y="65" fill="#FEF3C7" font-size="12" font-weight="bold">OpenSearch / Vector DB</text>
    <text x="562" y="82" fill="#94A3B8" font-size="10">H3 Spatial Indexing (Hexagonal tiles)</text>
    <text x="562" y="98" fill="#94A3B8" font-size="10">Instant Listing Full-Text Search</text>

    <!-- Apache Kafka / Event Bus -->
    <rect x="815" y="40" width="245" height="75" rx="8" fill="#0F172A" stroke="#8B5CF6" stroke-width="1" />
    <text x="827" y="65" fill="#EDE9FE" font-size="12" font-weight="bold">Apache Kafka / Event Streams</text>
    <text x="827" y="82" fill="#94A3B8" font-size="10">Change Data Capture (Debezium)</text>
    <text x="827" y="98" fill="#94A3B8" font-size="10">Async Booking &amp; Review Pipelines</text>
  </g>

  <!-- LAYER 5: CI/CD, OBSERVABILITY & SECURITY -->
  <g transform="translate(60, 660)">
    <rect width="1080" height="90" fill="#1E293B" stroke="#334155" stroke-width="1.5" rx="12" filter="url(#glow)"/>
    <text x="20" y="25" fill="#34D399" font-size="12" font-weight="bold" letter-spacing="1">5. CI/CD AUTOMATION, OBSERVABILITY &amp; SECURITY DEPLOYMENT</text>

    <!-- GitHub Actions & ArgoCD -->
    <rect x="20" y="38" width="330" height="40" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="1" />
    <text x="35" y="60" fill="#D1FAE5" font-size="11" font-weight="600">GitOps (GitHub Actions + ArgoCD)</text>
    <text x="35" y="72" fill="#94A3B8" font-size="9">Canary Deployments, Automated Rollbacks</text>

    <!-- Datadog & OpenTelemetry -->
    <rect x="375" y="38" width="330" height="40" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="1" />
    <text x="390" y="60" fill="#D1FAE5" font-size="11" font-weight="600">Observability (OpenTelemetry + Datadog)</text>
    <text x="390" y="72" fill="#94A3B8" font-size="9">Distributed APM Tracing, SLO/SLA Alerts</text>

    <!-- AWS KMS & Vault -->
    <rect x="730" y="38" width="330" height="40" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="1" />
    <text x="745" y="60" fill="#D1FAE5" font-size="11" font-weight="600">Security &amp; Secrets (HashiCorp Vault)</text>
    <text x="745" y="72" fill="#94A3B8" font-size="9">PCI-DSS Tier 1, Automated Key Rotation</text>
  </g>
</svg>
